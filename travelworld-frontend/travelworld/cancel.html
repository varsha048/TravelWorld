<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - TravelWorld</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 90%; }
        .icon { font-size: 60px; color: #ef4444; margin-bottom: 20px; }
        h1 { color: #1e293b; margin-bottom: 10px; font-size: 24px; }
        p { color: #64748b; margin-bottom: 30px; font-size: 15px; }
        .btn { display: inline-block; background: #94a3b8; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 500; transition: 0.3s; }
        .btn:hover { background: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <i class="fa-solid fa-circle-xmark icon"></i>
        <h1>Payment Cancelled</h1>
        <p>Your payment process was interrupted. You can try booking again when you are ready.</p>
        <a href="index.html" class="btn">Return Home</a>
    </div>
</body>
</html>
