<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - TravelWorld</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 90%; }
        .icon { font-size: 60px; color: #22c55e; margin-bottom: 20px; }
        h1 { color: #1e293b; margin-bottom: 10px; font-size: 24px; }
        p { color: #64748b; margin-bottom: 30px; font-size: 15px; }
        .btn { display: inline-block; background: #f97316; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 500; transition: 0.3s; }
        .btn:hover { background: #ea580c; }
    </style>
</head>
<body>
    <div class="card">
        <i class="fa-solid fa-circle-check icon"></i>
        <h1>Payment Successful!</h1>
        <p>Thank you for your payment. Your booking has been confirmed and we are preparing your itinerary!</p>
        <a href="mybookings.html" class="btn">View My Bookings</a>
    </div>
    <script src="js/api.js"></script>
    <script>
        // In a real app, the backend would listen for Stripe Webhooks to update the booking status.
        // For this demo, since we reached success, we could call a route to confirm it.
        // E.g. fetch(`/payments/confirm?id=...`)
    </script>
</body>
</html>
